[workspace]
resolver = "2"
members = [
    "crates/sango-primitives",
    "crates/sango-codec",
    "crates/sango-crypto",
    "crates/sango-types",
    "crates/sango-state",
    "crates/sango-mpt",
    "crates/sango-storage",
    "crates/sango-tx",
    "crates/sango-exec",
    "crates/sango-evm",     # ← nouveau
    "crates/sango-consensus",
    "crates/sango-mempool",
    "crates/sango-rpc",
    "crates/sango-node",
    "crates/sango-wallet",
    "crates/sango-p2p",
    "crates/sango-faucet",
    "crates/sango-explorer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Sango Contributors"]
repository = "https://github.com/sango/sango"

[workspace.dependencies]
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
libp2p = { version = "0.55", features = [
    "tokio",
    "quic",
    "gossipsub",
    "mdns",
    "macros",
    "ping",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
hex-literal = "0.4"

sango-primitives = { path = "crates/sango-primitives" }
sango-codec = { path = "crates/sango-codec" }
sango-crypto = { path = "crates/sango-crypto" }
sango-types = { path = "crates/sango-types" }
sango-storage = { path = "crates/sango-storage" }
sango-tx = { path = "crates/sango-tx" }
sango-state = { path = "crates/sango-state" }
sango-mpt = { path = "crates/sango-mpt" }
sango-exec = { path = "crates/sango-exec" }
sango-evm = { path = "crates/sango-evm" }
sango-node = { path = "crates/sango-node" }
sango-p2p = { path = "crates/sango-p2p" }
sango-consensus = { path = "crates/sango-consensus" }
sango-mempool = { path = "crates/sango-mempool" }
sango-rpc = { path = "crates/sango-rpc" }
sango-wallet = { path = "crates/sango-wallet" }
k256 = { version = "0.13", features = ["ecdsa"] }
rlp = "0.5"
bech32 = "0.11"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
