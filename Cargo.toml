[workspace]
resolver = "2"
members = [
    "crates/sango-primitives",
    "crates/sango-crypto",
    "crates/sango-codec",
    "crates/sango-types",
    "crates/sango-state",
    "crates/sango-storage",
    "crates/sango-tx",
    "crates/sango-mempool",
    "crates/sango-evm",
    "crates/sango-staking",
    "crates/sango-consensus",
    "crates/sango-p2p",
    "crates/sango-rpc",
    "crates/sango-node",
    "crates/sango-exec",
    "crates/sango-wallet",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Sango Contributors"]
repository = "https://github.com/sango/sango"

[workspace.dependencies]
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
libp2p = { version = "0.55", features = [
    "tokio",
    "quic",
    "gossipsub",
    "mdns",
    "macros",
    "ping",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
hex-literal = "0.4"

sango-primitives = { path = "crates/sango-primitives" }
sango-codec = { path = "crates/sango-codec" }
sango-crypto = { path = "crates/sango-crypto" }
sango-types = { path = "crates/sango-types" }
sango-storage = { path = "crates/sango-storage" }
sango-tx = { path = "crates/sango-tx" }
sango-state = { path = "crates/sango-state" }
sango-exec = { path = "crates/sango-exec" }
sango-node = { path = "crates/sango-node" }
sango-p2p = { path = "crates/sango-p2p" }
sango-consensus = { path = "crates/sango-consensus" }
sango-mempool = { path = "crates/sango-mempool" }
sango-rpc = { path = "crates/sango-rpc" }
sango-wallet = { path = "crates/sango-wallet" }
